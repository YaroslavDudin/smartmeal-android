name: Android Tests

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'client/**'
      - 'server/**'
  pull_request:
    branches: [ "main", "master" ]
    paths:
      - 'client/**'
      - 'server/**'

jobs:
  unit-tests:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x ./client/SmartMeal/gradlew

      - name: Run Unit Tests
        run: ./client/SmartMeal/gradlew -p ./client/SmartMeal :app:testDebugUnitTest

  instrumented-tests:
    name: UI Test on ${{ matrix.device.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    strategy:
      fail-fast: false
      matrix:
        device:
          - name: 'Small-Phone'
            profile: 'Nexus 4' 
          - name: 'Large-Phone'
            profile: 'Nexus 6'
          - name: 'Modern-Phone'
            profile: 'pixel_5'
          - name: 'Tablet'
            profile: 'pixel_c'

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: smartmeal_db
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python for Backend
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r server/requirements.txt

      - name: Start Backend Server
        run: |
          cd server
          python manage.py migrate
          python manage.py runserver 0.0.0.0:8000 &
        env:
          DB_NAME: smartmeal_db
          DB_USER: user
          DB_PASSWORD: password
          DB_HOST: localhost
          DB_PORT: 5432
          SECRET_KEY: ci-secret-key
          DEBUG: True

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android UI tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          profile: ${{ matrix.device.profile }}
          disable-animations: true
          working-directory: ./client/SmartMeal
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: ./gradlew :app:connectedDebugAndroidTest
