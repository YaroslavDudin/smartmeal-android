name: Android Tests

on:
  push:
  pull_request:
    branches: [ "main", "master" ]

jobs:
  unit-tests:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x ./client/SmartMeal/gradlew

      - name: Run Unit Tests
        run: ./client/SmartMeal/gradlew -p ./client/SmartMeal :app:testDebugUnitTest

      - name: Upload Unit Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: client/SmartMeal/app/build/reports/tests/testDebugUnitTest/

  instrumented-tests:
    name: Run UI Tests on ${{ matrix.device.name }}
    runs-on: ubuntu-latest
    
    strategy:
      fail-fast: false # Все устройства тестируются независимо друг от друга
      matrix:
        device:
          # Добавляем маленький телефон
          - name: 'Small-Phone'
            profile: 'Nexus 4' # (Small-Phone): Это классический смартфон с небольшим экраном (4.7 дюйма, 768x1280).
            
          # Большой телефон
          - name: 'Large-Phone'
            profile: 'Nexus 6' # (Large-Phone): Это крупный смартфон (почти 6 дюймов, 1440x2560)

          # Современный вытянутый телефон
          - name: 'Modern-Phone'
            profile: 'Pixel 6' # (Modern-Phone):  Это обычный телефон ( 1080x2400)

          # Планшет
          - name: 'Tablet'
            profile: 'pixel_c' # (Tablet): Это полноценный 10-дюймовый планшет (2560x1800)

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Grant execute permission for gradlew
        run: chmod +x ./client/SmartMeal/gradlew

      - name: Run Android tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: ${{ matrix.device.profile }} # Сюда автоматически подставится профиль из матрицы
          disable-animations: true
          working-directory: ./client/SmartMeal
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: ./gradlew :app:connectedDebugAndroidTest

      - name: Upload Instrumented Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports-${{ matrix.device.name }}
          path: client/SmartMeal/app/build/reports/androidTests/connected/