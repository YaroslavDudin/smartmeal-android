name: Android Tests

on:
  push:
    paths:
      - 'client/**'
      - 'server/**'
      - '.github/workflows/android-tests.yml'
  pull_request:
    branches: [ "main", "master" ]
    paths:
      - 'client/**'
      - 'server/**'
      - '.github/workflows/android-tests.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Grant execute permission for gradlew
        run: chmod +x ./client/SmartMeal/gradlew

      - name: Run Unit Tests
        run: ./client/SmartMeal/gradlew -p ./client/SmartMeal :app:testDebugUnitTest

      # Обязательно сохраняем результаты тестов, даже если они упали
      - name: Upload Unit Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: client/SmartMeal/app/build/reports/tests/testDebugUnitTest/

  instrumented-tests:
    name: UI Test on ${{ matrix.device.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    strategy:
      fail-fast: false
      matrix:
        device:
          - name: 'Small-Phone'
            profile: 'Nexus 4' 
          - name: 'Large-Phone'
            profile: 'Nexus 6'
          - name: 'Modern-Phone'
            profile: 'pixel_5'
          - name: 'Tablet'
            profile: 'pixel_c'

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: smartmeal_db
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python for Backend
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r server/requirements.txt

      - name: Start Backend Server & Load Data
        env:
          DB_NAME: smartmeal_db
          DB_USER: user
          DB_PASSWORD: password
          DB_HOST: localhost
          DB_PORT: 5432
          SECRET_KEY: ci-secret-key
          DEBUG: True
          ALLOWED_HOSTS: "*"
        run: |
          cd server
          python manage.py migrate
          
          # Загружаем фикстуры, чтобы UI-тестам было с чем взаимодействовать
          # Не используем make load_data, т.к. в CI нет виртуального окружения (venv)
          python manage.py loaddata fixtures/accounts_static.json || echo "No static accounts"
          python manage.py loaddata fixtures/recipes_data.json || echo "No recipes"
          python manage.py loaddata fixtures/accounts_users.json || echo "No users"
          python manage.py loaddata fixtures/menus_data.json || echo "No menus"
          python manage.py loaddata fixtures/cart_data.json || echo "No cart"

          python manage.py runserver 0.0.0.0:8000 &
          
          echo "Waiting for backend to start..."
          for i in {1..30}; do
            if curl -s http://localhost:8000/ > /dev/null; then
              echo "Backend is up!"
              break
            fi
            echo "Waiting... ($i)"
            sleep 2
          done

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Grant execute permission for gradlew
        run: chmod +x ./client/SmartMeal/gradlew

      - name: Run Android UI tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30 # Возвращаем стабильный 30 уровень, как было в рабочей версии
          target: google_apis
          arch: x86_64
          profile: ${{ matrix.device.profile }}
          disable-animations: true
          working-directory: ./client/SmartMeal
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: ./gradlew :app:connectedDebugAndroidTest

      - name: Upload Instrumented Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports-${{ matrix.device.name }}
          path: client/SmartMeal/app/build/reports/androidTests/connected/